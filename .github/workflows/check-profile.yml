name: Check profile

on:
  pull_request:
    paths:
      - "profiles/**"
      - "app/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: List changed files
        run: git diff --name-only --diff-filter=AMR "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt && cat /tmp/changed.txt

      - name: Check your profile folder
        working-directory: app
        run: |
          if grep -qv '^profiles/' /tmp/changed.txt; then
            echo "This PR changes the website code, so it is checked by the build step below instead."
            node scripts/validate-profiles.mjs
          else
            node scripts/validate-profiles.mjs --author "${{ github.event.pull_request.user.login }}" --changed /tmp/changed.txt
          fi

      - name: Make sure the site still builds
        working-directory: app
        run: npm run build
