name: Site build

# Builds the site for pull requests that change the website code (the solo-round issues).
# Profile-only PRs are handled by the wall bot instead.
on:
  pull_request:
    paths-ignore:
      - "profiles/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Check every profile
        working-directory: app
        run: node scripts/validate-profiles.mjs
      - name: Build
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
